# PostPilot → Vercel 部署
#
# 用途：讓部署在 GitHub 的機器上執行（可連到 Vercel），繞開本機/沙盒的網路限制。
#
# 兩種部署方式，擇一即可：
#   (A) 【最簡單，建議】直接用 Vercel 的 GitHub 整合：到 vercel.com 匯入本 repo，
#       之後每次 push 會自動部署，完全不需要這個 workflow。
#   (B) 【用本 workflow】若你偏好用 token 在 CI 部署，照下面「設定」補上 secrets，
#       再到 Actions 分頁手動按 "Run workflow"。
#
# 設定（僅 (B) 需要）：
#   1. 先在 vercel.com 匯入一次本專案（產生 Vercel Project）。
#   2. 本機執行 `npx vercel link` 後，讀 .vercel/project.json 取得 orgId / projectId。
#   3. 到 GitHub → repo Settings → Secrets and variables → Actions 新增：
#        VERCEL_TOKEN     （vercel.com → Account Settings → Tokens 產生）
#        VERCEL_ORG_ID    （= project.json 的 orgId）
#        VERCEL_PROJECT_ID（= project.json 的 projectId）
#   4. Supabase 等環境變數設在「Vercel 專案的 Environment Variables」即可，
#      本 workflow 會用 `vercel pull` 自動帶下來，不需放進 GitHub secrets。
#
# 註：設成手動觸發（workflow_dispatch）。若你沒用 Vercel GitHub 整合、想每次 push
#     自動部署，把下面 push 那段的註解拿掉即可。

name: Deploy to Vercel

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - claude/analytics-menu-site-title-5qxb8v

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check secrets
        id: guard
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::warning::尚未設定 VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID，略過部署。請依檔頭「設定」補上後再手動 Run。"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.guard.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        if: steps.guard.outputs.ok == 'true'
        run: npm i -g vercel@latest

      - name: Pull Vercel project settings & env
        if: steps.guard.outputs.ok == 'true'
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        if: steps.guard.outputs.ok == 'true'
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy (prebuilt) to production
        if: steps.guard.outputs.ok == 'true'
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
